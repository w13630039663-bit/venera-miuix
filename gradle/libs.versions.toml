[versions]
agp = "9.3.2"
coreKtx = "1.12.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
kotlin = "2.4.10"
compose = "1.7.8"
# ⚠️ material3 必须与 Miuix 运行期实际解析到的版本一致。
# 原先写 1.3.1，但 miuix-ui 0.9.4-rc01 只在 runtimeClasspath 上把 material3 顶到
# 1.5.0-alpha22 ⇒ 编译期(1.3.1)/运行期(1.5.0-alpha22) API 不一致，
# 参数列表变过的组件（如 ModalBottomSheet）会在运行时抛 NoSuchMethodError 闪退。
# 改版本前务必先跑 :app:dependencies --configuration debugRuntimeClasspath 核对。
material3 = "1.5.0-alpha22"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.10.1"
pagingCompose = "3.3.6"
coil = "3.6.2"
okhttp = "4.12.0"
gson = "2.11.0"
jsoup = "1.18.1"
coroutines = "1.8.1"
serializationJson = "1.11.0"
miuix = "0.9.4-rc01"
telephoto = "0.19.0"
work = "2.9.1"
# Kyant0/AndroidLiquidGlass 官方液态玻璃库（Compose Multiplatform）
# https://github.com/Kyant0/AndroidLiquidGlass  docs: https://kyant.gitbook.io/backdrop
backdrop = "2.0.1"
# Backdrop 的 shape 体系（Capsule / RoundedRectangularShape）；lens 需要它提供圆角半径
kyantShapes = "1.2.1"
# Material Motion 转场规格的 Compose 实现（soup.compose.material.motion，EhViewer 同款）。
# 坐标见 Maven Central: io/github/fornewid/material-motion-compose-core
materialMotion = "2.0.1"
# 种子色生成 MD3 色板（自定义取色用）；版本取自 Maven Central 当前 release
materialKolor = "5.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Compose 基础
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# 架构：导航 + ViewModel + 分页（S0 地基）
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingCompose" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "pagingCompose" }

# 图片（Coil 3，总纲要求；含按域自定义 OkHttpClient）
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
telephoto-zoomable-image-coil = { group = "me.saket.telephoto", name = "zoomable-image-coil3", version.ref = "telephoto" }

# S5-5 追更：官方建议的 androidx.work（PeriodicWorkRequest + 唯一命名工作）
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# 网络 / 解析 / 脚本
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-dnsoverhttps = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
quickjs-android = { group = "app.cash.quickjs", name = "quickjs-android", version = "0.9.2" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
# Miuix 官方图标集（GridView / ListView 等）。依赖面已核 .module：只拉 miuix-core + compose foundation，
# **不引用 material3**，因此不会顶掉被 Miuix 钉住的 material3 1.5.0-alpha22。
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }

miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur", version.ref = "miuix" }

# Compose Preview 支持（tooling 仅 debug 打包；preview 注解编译期需要）
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }

# 官方液态玻璃（Kyant0/AndroidLiquidGlass）。提供 Backdrop / drawBackdrop / lens / blur 等。
# Android 12+ 才能生效 RenderEffect，lens（RuntimeShader）需要 Android 13+。
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
kyant-shapes = { group = "io.github.kyant0", name = "shapes", version.ref = "kyantShapes" }
# 只 requires compose 1.6.x，不会把本项目的 Compose/material3 版本顶来顶去（已核 .module 的 version.requires）
material-motion-core = { group = "io.github.fornewid", name = "material-motion-compose-core", version.ref = "materialMotion" }
# 种子色 → 整套 MD3 色板。Android 自带的 DynamicColors 只吃系统壁纸，喂不进自定义种子。
# 坐标见 Maven Central: com/materialkolor/material-kolor（5.0.1 为当前 release）
material-kolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }