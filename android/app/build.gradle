plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// 签名配置：key.properties 被 .gitignore 排除，不会进仓库，
// 因此这里**必须容忍文件缺失** —— 否则任何人克隆本仓库后执行
// `flutter build apk --release` 都会在 Gradle 配置阶段抛
// FileNotFoundException，直接构建失败。
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
    hasSigningConfig = keystoreProperties["storeFile"] != null
} else {
    logger.lifecycle("key.properties not found: release builds will use the debug signing key.")
}

android {
    namespace = "com.github.w13630039663bit.venera.miuix"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            enable true
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        // 只有提供了 key.properties 时才定义自定义签名。
        // 缺失时保留 AGP 自带的 debug 签名，release 变体回退到它 ——
        // 这样「没有密钥的人」也能构建出可安装的包（仅用于本地试用，
        // 正式分发请务必自备密钥）。
        if (hasSigningConfig) {
            // 与原上游行为保持一致：debug 也用同一把密钥签名，
            // 这样 `flutter run` 可以直接覆盖本机已安装的 release 包。
            debug {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.github.w13630039663bit.venera.miuix"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            // 没有 key.properties 时回退到 AGP 自带的 debug 签名，
            // 保证新克隆的仓库开箱即可构建、可安装。
            signingConfig hasSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        // 只处理 release：本 fork 不再分发 debug/profile 产物，
        // debug 变体保留仅为 `flutter run` 服务，不做重命名与 versionCode 覆盖。
        if (variant.buildType.name != "release") return
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = "venera-miuix-${variant.versionName}-${abi}.apk"
                def abiVersionCode = project.ext.abiCodes.get(abi)
                if (abiVersionCode != null) {
                    versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                }
            } else {
                outputFileName = "venera-miuix-${variant.versionName}.apk"
                versionCodeOverride = variant.versionCode * 10
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
